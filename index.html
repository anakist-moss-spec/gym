<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>운동일지</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2446e8">
<link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🏋️%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body><main>
<h1>운동일지</h1>
<div class="sub"><span id="today"></span><span id="sync">이 기기에만 저장</span></div>
<div class="tabs" role="tablist">
<button role="tab" data-t="log" aria-selected="true">기록</button>
<button role="tab" data-t="trend" aria-selected="false">추이</button>
<button role="tab" data-t="hist" aria-selected="false">내역</button>
</div>

<section id="v-log">
<div class="card" id="daycard"></div>
<div class="card"><p class="lbl">오늘 요약</p><div id="sum" class="mini" style="margin:0;color:var(--ink)"></div><button class="ghost" id="shr" style="margin-top:10px">오늘 운동 공유하기</button><p class="mini" id="shrmsg" style="margin:6px 0 0"></p></div>
<div class="card hide" id="qk"><p class="lbl">오늘 한 운동 (눌러서 이어서 기록)</p><div class="chips" id="qkc"></div></div>
<div class="card">
<p class="lbl">1. 부위</p><div class="chips" id="parts"></div>
<div id="exbox" class="hide">
<p class="lbl" style="margin-top:14px">2. 운동</p>
<select id="ex"></select>
<div id="newbox" class="row hide"><input type="text" id="nx" placeholder="새 운동 이름"><button class="sq" style="width:76px;font-size:15px" id="nxb">추가</button></div>
</div>
</div>
<div class="card hide" id="entry">
<div id="cmp"></div>
<p class="lbl" style="margin-top:8px">3. 무게와 횟수 (무게 0은 맨몸)</p>
<div class="row" id="wrow"><span class="name" id="wname">무게</span><button class="sq" id="wm">−</button><input type="number" id="w" inputmode="decimal" step="0.5" value="0"><button class="sq" id="wp">+</button></div>
<div class="row" id="rrow"><span class="name">횟수</span><button class="sq" id="rm">−</button><input type="number" id="r" inputmode="numeric" value="10"><button class="sq" id="rp">+</button></div>
<div class="row hide" id="crow"><span class="name">시간</span><input type="number" id="cm" inputmode="numeric" value="10"><span>분</span><input type="number" id="cs" inputmode="numeric" value="0"><span>초</span></div>
<p class="lbl" id="stl" style="margin-top:12px">무게 증감 단위 (kg)</p><div class="chips" id="steps"></div>

<button class="go" id="add">세트 기록</button>
<div id="todaysets" style="margin-top:10px"></div>
</div>
</section>

<section id="v-trend" class="hide">
<div class="card">
<p class="lbl">운동</p><select id="cx"></select>
<p class="lbl" style="margin-top:12px">보는 값</p><div class="chips" id="mets"></div><p class="lbl" style="margin-top:12px">기간</p><div class="chips" id="pers"></div>
<div id="chart" style="margin-top:12px"></div>
<div id="cvals" class="mini"></div><div id="wk" style="margin-top:14px"></div>
</div>
</section>

<section id="v-hist" class="hide">
<div class="card"><button class="ghost" id="csv">CSV로 내보내기 (엑셀, 구글 시트)</button><button class="ghost" id="bk" style="margin-top:8px">백업 파일 저장 (JSON)</button><button class="ghost" id="rsb" style="margin-top:8px">백업 파일 불러오기</button><input type="file" id="rs" accept=".json,application/json" class="hide"><p class="mini" id="csvmsg">내보내기는 선택 사항입니다. 기록은 이 앱에 계속 쌓입니다.</p></div>
<div id="days"></div>
</section>
</main>


<script src="js/catalog.js?v=5"></script>
<script src="js/util.js?v=5"></script>
<script src="js/store.js?v=5"></script>
<script src="js/views/log.js?v=5"></script>
<script src="js/views/trend.js?v=5"></script>
<script src="js/views/history.js?v=5"></script>
<script src="js/main.js?v=5"></script>
</body></html>
